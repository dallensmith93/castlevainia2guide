    function App() {
      // Episode state
      const [currentEpId, setCurrentEpId] = useState(1);
      const [compactMode, setCompactMode] = useState(false);
      
      // Checklist items persistence
      const [checkedTasks, setCheckedTasks] = useState(() => {
        try {
          const saved = localStorage.getItem("cv2_lp_tasks");
          return saved ? JSON.parse(saved) : {};
        } catch(e) {
          return {};
        }
      });

      // Streamer scratchpad notes per episode
      const [notes, setNotes] = useState(() => {
        try {
          const saved = localStorage.getItem("cv2_lp_notes");
          return saved ? JSON.parse(saved) : {};
        } catch(e) {
          return {};
        }
      });

      // In-game day counter simulator (Best ending target < 8 days)
      const [inGameDays, setInGameDays] = useState(() => {
        const saved = localStorage.getItem("cv2_game_days");
        return saved ? parseFloat(saved) : 1.0;
      });

      // Heart planner checks
      const [boughtItems, setBoughtItems] = useState(() => {
        try {
          const saved = localStorage.getItem("cv2_hearts_items");
          return saved ? JSON.parse(saved) : {};
        } catch(e) {
          return {};
        }
      });

      // Clue accordion filter
      const [clueSearch, setClueSearch] = useState("");
      const [activeTab, setActiveTab] = useState("guide"); // 'guide', 'clues', 'hearts', 'timer'

      // Save state changes
      useEffect(() => {
        localStorage.setItem("cv2_lp_tasks", JSON.stringify(checkedTasks));
      }, [checkedTasks]);

      useEffect(() => {
        localStorage.setItem("cv2_lp_notes", JSON.stringify(notes));
      }, [notes]);

      useEffect(() => {
        localStorage.setItem("cv2_game_days", inGameDays.toString());
      }, [inGameDays]);

      useEffect(() => {
        localStorage.setItem("cv2_hearts_items", JSON.stringify(boughtItems));
      }, [boughtItems]);

      const toggleTask = (taskId) => {
        setCheckedTasks(prev => ({
          ...prev,
          [taskId]: !prev[taskId]
        }));
      };

      const handleNoteChange = (text) => {
        setNotes(prev => ({
          ...prev,
          [currentEpId]: text
        }));
      };

      const toggleHeartItem = (idx) => {
        setBoughtItems(prev => ({
          ...prev,
          [idx]: !prev[idx]
        }));
      };

      // Current episode pointer
      const currentEp = EPISODES_DATA.find(ep => ep.id === currentEpId) || EPISODES_DATA[0];

      // Calculation metrics
      const totalAllTasks = EPISODES_DATA.reduce((acc, ep) => acc + ep.tasks.length, 0);
      const totalCheckedTasks = Object.values(checkedTasks).filter(Boolean).length;
      const overallPercent = Math.round((totalCheckedTasks / totalAllTasks) * 100);

      const currentEpChecked = currentEp.tasks.filter(t => checkedTasks[t.id]).length;
      const currentEpPercent = Math.round((currentEpChecked / currentEp.tasks.length) * 100);

      // Heart math
      const totalMandatoryHearts = MANDATORY_HEARTS.filter(h => h.mandatory).reduce((a, b) => a + b.cost, 0);
      const heartsSpent = MANDATORY_HEARTS.reduce((sum, item, idx) => {
        return boughtItems[idx] ? sum + item.cost : sum;
      }, 0);

      // Ending calculation based on days
      const getEndingStatus = (days) => {
        if (days < 8) return { name: "Best Ending (Simon Lives, Sunset Graveyard)", color: "text-emerald-400", desc: "Simon survives without corruption. Dracula is sealed. Colorful ending screen." };
        if (days <= 14) return { name: "Normal Ending (Simon Lives, Pale Sky)", color: "text-amber-400", desc: "Simon lives, but the world and Simon are scarred. Monochrome screen." };
        return { name: "Bad Ending (Simon Dies from the Curse)", color: "text-red-500", desc: "Simon succumbs to Dracula's curse after the battle and is buried in Transylvania." };
      };

      const endingInfo = getEndingStatus(inGameDays);

      return (
        <div className="min-h-screen flex flex-col justify-between">
          {/* Top Vintage Vampire Gothic Header */}

            <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">

                    <p className="text-xs text-stone-300 mt-2 leading-relaxed">

                    </p>

                  <div className={`gothic-panel rounded-xl p-5 border-l-4 ${inGameDays > 14 ? "border-l-red-600 ring-1 ring-red-600/30" : "border-l-stone-700 opacity-70"}`}>

                    <h4 className="font-cinzel text-lg font-bold text-stone-100 mt-2">Bad Ending</h4>
                    <p className="text-xs text-stone-300 mt-2 leading-relaxed">

            )}
          </main>

          {}
          <footer className="border-t border-stone-900 bg-[#0a090e] px-4 py-4 text-center text-xs text-stone-500">
